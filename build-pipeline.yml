trigger:
- develop

pool:
  vmImage: 'ubuntu-latest'

  steps:
  - task: UseDotNet@2
    displayName: 'Install .NET SDK'
    inputs:
    version: '10.x'

  - task: DotNetCoreCLI@2
    displayName: 'Build'
    inputs:
      command: build

  - task: DotNetCoreCLI@2
    displayName: 'Test'
    inputs:
      command: test